<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Top G</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Poppins',sans-serif;background:#050505;color:#e8e8e8;overflow:hidden}
.bg-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;filter:brightness(.55) contrast(1.05)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1;pointer-events:none}
.intro{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);cursor:pointer;transition:opacity .7s cubic-bezier(.22,1,.36,1),visibility .7s}
.intro.hide{opacity:0;visibility:hidden;pointer-events:none}
.intro span{font-size:1.05rem;font-weight:500;letter-spacing:.08em;color:rgba(255,255,255,.85);text-transform:uppercase;padding:12px 28px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(255,255,255,.04);transition:background .2s,border-color .2s,transform .25s}
.intro:hover span{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.28);transform:scale(1.03)}
.wrap{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;perspective:1200px}
.stack{display:flex;flex-direction:column;align-items:center;gap:18px;transform-style:preserve-3d;will-change:transform;opacity:0;transform:translateY(36px) scale(.97);transition:opacity .7s cubic-bezier(.22,1,.36,1),transform .7s cubic-bezier(.22,1,.36,1)}
.stack.show{opacity:1;transform:translateY(0) scale(1)}
.stack.tilting{transition:transform .12s ease-out}
.card{opacity:0;transform:translateY(16px);transition:opacity .6s cubic-bezier(.22,1,.36,1) .15s,transform .6s cubic-bezier(.22,1,.36,1) .15s}
.clock-card{opacity:0;transform:translateY(16px);transition:opacity .55s cubic-bezier(.22,1,.36,1) .45s,transform .55s cubic-bezier(.22,1,.36,1) .45s}
.stack.show .card,.stack.show .clock-card{opacity:1;transform:translateY(0)}
.socials{opacity:0;transition:opacity .5s ease .55s}
.stack.show .socials{opacity:1}
.card,.clock-card{position:relative;background:rgba(12,12,14,.84);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:22px}
.card{padding:22px 26px;width:min(420px,94vw);box-shadow:0 12px 40px rgba(0,0,0,.55)}
.clock-card{display:flex;align-items:center;gap:14px;padding:14px 20px;width:min(420px,94vw);box-shadow:0 10px 30px rgba(0,0,0,.5);border-radius:18px}
@property --beam{syntax:'<angle>';inherits:false;initial-value:0deg}
.card::before,.clock-card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:conic-gradient(from var(--beam),transparent 0%,transparent 84%,rgba(255,255,255,.15) 89%,rgba(255,255,255,.9) 92.5%,rgba(255,255,255,.15) 96%,transparent 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;animation:beamMove 5s linear infinite;z-index:0}
@keyframes beamMove{to{--beam:360deg}}
.top{display:flex;align-items:center;gap:18px;position:relative;z-index:1}
.avatar-wrap{position:relative;width:78px;height:78px;flex-shrink:0}
.avatar{width:78px;height:78px;border-radius:50%;object-fit:cover;display:block;border:2px solid rgba(255,255,255,.1)}
.decoration{position:absolute;inset:-18px;width:calc(100% + 36px);height:calc(100% + 36px);pointer-events:none;object-fit:contain}
.info{flex:1;min-width:0;position:relative;z-index:1}
.name-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.name{font-size:1.15rem;font-weight:600;color:#f2f2f2;letter-spacing:.2px;position:relative;cursor:default}
.name:hover::after{content:"UID 1";position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#111;color:#fff;font-size:.68rem;font-weight:500;padding:4px 9px;border-radius:6px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.5);pointer-events:none;z-index:20;letter-spacing:.03em}
.name:hover::before{content:"";position:absolute;bottom:calc(100% + 3px);left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#111;z-index:20}
.badge{width:17px;height:17px;object-fit:contain;flex-shrink:0}
.user{font-size:.8rem;color:#8a8a8a;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:.7rem;font-weight:500;color:#b0b0b0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);padding:3px 10px;border-radius:999px;letter-spacing:.02em}
.socials{display:flex;justify-content:center;gap:16px;margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.06);position:relative;z-index:1}
.socials a{color:#7a7a7a;transition:color .2s,transform .2s;display:inline-flex;align-items:center}
.socials a:hover{color:#e0e0e0;transform:translateY(-2px)}
.socials img,.socials svg{width:18px;height:18px}
.socials a img{filter:grayscale(1) brightness(0.75);opacity:.85;transition:filter .2s,opacity .2s}
.socials a:hover img{filter:grayscale(1) brightness(1.1);opacity:1}
.clock-svg{width:42px;height:42px;flex-shrink:0;color:#fff;position:relative;z-index:1}
.clock-text{display:flex;flex-direction:column;gap:1px;position:relative;z-index:1}
.clock-time{font-size:1.15rem;font-weight:600;letter-spacing:.5px;font-variant-numeric:tabular-nums}
.clock-date{font-size:.72rem;color:#888}
.clock-offset{font-size:.68rem;color:#666}
.volume{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:10px;background:rgba(14,14,16,.88);backdrop-filter:blur(12px);padding:8px 16px;border-radius:999px;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 8px 24px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .5s ease .3s}
.volume.show{opacity:1;pointer-events:auto}
.volume svg{width:18px;height:18px;color:#ccc;flex-shrink:0}
.volume input[type=range]{-webkit-appearance:none;appearance:none;width:110px;height:4px;background:rgba(255,255,255,.18);border-radius:2px;outline:none}
.volume input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;cursor:pointer;box-shadow:0 0 6px rgba(0,0,0,.4)}
.volume input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;cursor:pointer;border:none}
</style>

<script>
const intro=document.getElementById('intro');
const stack=document.getElementById('stack');
const volWrap=document.getElementById('volWrap');
const bg=document.getElementById('bg');
const bgm=document.getElementById('bgm');
const vol=document.getElementById('vol');
const typeEl=document.getElementById('type');
const full='The Top G';
let charIndex=0;
let isDeleting=false;
let started=false;
function typeLoop(){
if(!started)return;
typeEl.textContent=full.slice(0,charIndex);
if(!isDeleting&&charIndex===full.length){
setTimeout(()=>{isDeleting=true;typeLoop()},1800);
return;
}
if(isDeleting&&charIndex===0){
isDeleting=false;
setTimeout(typeLoop,600);
return;
}
if(isDeleting)charIndex--;
else charIndex++;
setTimeout(typeLoop,isDeleting?38:68);
}
intro.addEventListener('click',()=>{
if(started)return;
started=true;
intro.classList.add('hide');
stack.classList.add('show');
volWrap.classList.add('show');
bg.play().catch(()=>{});
bgm.volume=parseFloat(vol.value);
bgm.play().catch(()=>{});
typeLoop();
setTimeout(()=>{tiltReady=true;stackEl.classList.add('tilting')},900);
});
vol.addEventListener('input',()=>{bgm.volume=parseFloat(vol.value)});
const cities=[
{name:'Berlin',tz:'Europe/Berlin'},
{name:'Paris',tz:'Europe/Paris'},
{name:'Amsterdam',tz:'Europe/Amsterdam'},
{name:'Madrid',tz:'Europe/Madrid'},
{name:'Rome',tz:'Europe/Rome'},
{name:'Stockholm',tz:'Europe/Stockholm'},
{name:'Vienna',tz:'Europe/Vienna'},
{name:'Prague',tz:'Europe/Prague'},
{name:'Warsaw',tz:'Europe/Warsaw'},
{name:'Budapest',tz:'Europe/Budapest'},
{name:'Copenhagen',tz:'Europe/Copenhagen'},
{name:'Brussels',tz:'Europe/Brussels'},
{name:'Lisbon',tz:'Europe/Lisbon'},
{name:'Athens',tz:'Europe/Athens'},
{name:'Helsinki',tz:'Europe/Helsinki'}
];
const place=cities[Math.floor(Math.random()*cities.length)];
function updateClock(){
const now=new Date();
const fmt=new Intl.DateTimeFormat('en-GB',{timeZone:place.tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
const parts=fmt.formatToParts(now);
const h=parseInt(parts.find(p=>p.type==='hour').value);
const m=parseInt(parts.find(p=>p.type==='minute').value);
const s=parseInt(parts.find(p=>p.type==='second').value);
const ms=now.getMilliseconds();
const hs=((h%12)+m/60+s/3600)*30;
const mins=(m+s/60+ms/60000)*6;
const secs=(s+ms/1000)*6;
document.getElementById('hourHand').style.transform=`rotate(${hs}deg)`;
document.getElementById('minuteHand').style.transform=`rotate(${mins}deg)`;
document.getElementById('secondHand').style.transform=`rotate(${secs}deg)`;
const pad=n=>String(n).padStart(2,'0');
document.getElementById('timeStr').textContent=`${pad(h)}:${pad(m)}:${pad(s)}`;
const dFmt=new Intl.DateTimeFormat('en-GB',{timeZone:place.tz,weekday:'short',month:'short',day:'numeric',timeZoneName:'shortOffset'});
const dParts=dFmt.formatToParts(now);
const weekday=dParts.find(p=>p.type==='weekday')?.value||'';
const month=dParts.find(p=>p.type==='month')?.value||'';
const day=dParts.find(p=>p.type==='day')?.value||'';
const offset=dParts.find(p=>p.type==='timeZoneName')?.value||'';
document.getElementById('dateStr').textContent=`${weekday}, ${month} ${day} · ${offset}`;
document.getElementById('offsetStr').textContent=place.name;
}
updateClock();
setInterval(updateClock,50);
const stackEl=document.getElementById('stack');
let tiltReady=false;
stackEl.addEventListener('mousemove',e=>{
if(!tiltReady)return;
const rect=stackEl.getBoundingClientRect();
const x=e.clientX-rect.left;
const y=e.clientY-rect.top;
const cx=rect.width/2;
const cy=rect.height/2;
const rx=((y-cy)/cy)*-8;
const ry=((x-cx)/cx)*8;
stackEl.style.transform=`translateY(0) scale(1) rotateX(${rx}deg) rotateY(${ry}deg)`;
});
stackEl.addEventListener('mouseleave',()=>{
if(!tiltReady)return;
stackEl.style.transform='translateY(0) scale(1) rotateX(0deg) rotateY(0deg)';
});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='J'||e.key==='C'))||(e.ctrlKey&&e.key==='U')||(e.metaKey&&e.altKey&&e.key==='I')){
e.preventDefault();
e.stopPropagation();
return false;
}
});
document.addEventListener('selectstart',e=>e.preventDefault());
</script>
